<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CarePoint{% endblock %} — CarePoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <nav class="nav">
        <a class="nav-brand" href="/">CarePoint</a>
        <div class="nav-links">
            {% if session.user_id %}
                <span>{{ session.name }}</span>
                <a href="/logout">Log out</a>
            {% else %}
                <a href="/login">Log in</a>
                <a href="/register">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="{% block container_class %}container{% endblock %}">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block main %}{% endblock %}
    </div>

</body>
</html>
