{% extends "layout.html" %}

{% block title %}Log in{% endblock %}

{% block main %}
<div class="auth-shell">
    <div class="auth-hero">
        <p class="eyebrow">CarePoint access</p>
        <h1>Welcome back</h1>
        <p>Keep your care journey organized with secure scheduling, visit history, and provider updates.</p>
    </div>

    <div class="card auth-card">
        <h2>Log in</h2>
        <p class="subtitle">Access your CarePoint account.</p>

        <form action="/login" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log in</button>
        </form>

        <p class="form-footer">Don't have an account? <a href="/register">Register</a></p>
    </div>
</div>
{% endblock %}
